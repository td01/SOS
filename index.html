<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="description" content="Summer of Soccer — 2026 World Cup live scores, fixtures, groups and history">
<meta name="theme-color" content="#FF3CAC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Summer of Soccer · 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- PICK SCREEN -->
<div id="s-pick">
  <div class="pick-hero">
    <div class="pick-hero-rule"></div>
    <div class="pick-eye">2026 World Cup</div>
    <div class="pick-title">Summer<br><b>of Soccer</b></div>
  </div>
  <div class="region-bar">
    <button class="rbtn on" onclick="rgn('ALL',this)">All 32</button>
    <button class="rbtn" onclick="rgn('EUR',this)">Europe</button>
    <button class="rbtn" onclick="rgn('AME',this)">Americas</button>
    <button class="rbtn" onclick="rgn('AFR',this)">Africa</button>
    <button class="rbtn" onclick="rgn('ASI',this)">Asia/Pac</button>
  </div>
  <div class="ctry-list" id="ctry-list"></div>
  <div class="pick-footer">
    <div class="pick-cnt" id="pick-cnt">None selected</div>
    <button class="go-btn" id="go-btn" disabled onclick="launch()">Let's Go →</button>
  </div>
</div>

<!-- APP -->
<div id="s-app">
  <div class="app-top">
    <div class="app-logo">☀ <span>Soccer</span> 26</div>
    <button class="edit-btn" onclick="back()">✎ Change teams</button>
  </div>
  <div class="team-pill-bar" id="pill-bar"></div>

  <div class="bottom-nav">
    <button class="bnav-btn on" onclick="tab('live',this)" aria-label="Live scores">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16"/></svg>
      <span class="bnav-label">Live</span>
    </button>
    <button class="bnav-btn" onclick="tab('sched',this)" aria-label="Schedule">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="0"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span class="bnav-label">Schedule</span>
    </button>
    <button class="bnav-btn" onclick="tab('groups',this)" aria-label="Groups">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span class="bnav-label">Groups</span>
    </button>
    <button class="bnav-btn" onclick="tab('hist',this)" aria-label="History">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>
      <span class="bnav-label">History</span>
    </button>
  </div>

  <div id="p-live" class="pane on">
    <div class="stat-row" id="stat-row"></div>
    <div class="sec">Live now</div>
    <div id="live-wrap"></div>
    <div class="sec">Today's results</div>
    <div id="done-wrap"></div>
  </div>

  <div id="p-sched" class="pane"></div>
  <div id="p-groups" class="pane"></div>
  <div id="p-hist" class="pane"></div>

</div>

<script src="flags.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
