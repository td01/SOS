<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="description" content="Summer of Soccer — Summer of Soccer live scores, fixtures, groups and history">
<meta name="theme-color" content="#1A1A2E">

<!-- PWA / installability -->
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soccer">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<title>Summer of Soccer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOADING SCREEN -->
<div id="s-loading">
  <img src="icon-loading.png" alt="Summer of Soccer" class="loading-icon">
</div>

<!-- PICK SCREEN -->
<div id="s-pick">
  <div class="pick-hero">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <span class="app-logo-text">SUMMER <em>OF SOCCER</em></span>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:.14em;color:#ffffff35">PICK YOUR TEAMS</div>
    </div>
    <div class="pick-meta">
      <div class="pick-meta-item">
        <div class="pick-meta-val">48</div>
        <div class="pick-meta-lbl">Teams</div>
      </div>
      <div class="pick-meta-div"></div>
      <div class="pick-meta-item">
        <div class="pick-meta-val">104</div>
        <div class="pick-meta-lbl">Matches</div>
      </div>
      <div class="pick-meta-div"></div>
      <div class="pick-meta-item">
        <div class="pick-countdown" id="pick-countdown">—</div>
        <div class="pick-countdown-lbl" id="pick-countdown-lbl">Until kick off</div>
      </div>
    </div>
  </div>
  <div class="region-bar">
    <button class="rbtn on" onclick="rgn('ALL',this)">All 48</button>
    <button class="rbtn" onclick="rgn('EUR',this)">Europe</button>
    <button class="rbtn" onclick="rgn('AME',this)">Americas</button>
    <button class="rbtn" onclick="rgn('AFR',this)">Africa</button>
    <button class="rbtn" onclick="rgn('ASI',this)">Asia/Pac</button>
  </div>
  <div class="ctry-list" id="ctry-list"></div>
  <div class="pick-footer">
    <div class="pick-cnt-row">
      <div class="pick-cnt" id="pick-cnt">None selected</div>
      <button class="pick-clear-btn" id="pick-clear-btn" onclick="clearTeamSelection()" style="display:none">Clear</button>
    </div>
    <button class="go-btn" id="go-btn" disabled onclick="launch()">Let's Go →</button>
  </div>
</div>

<!-- APP -->
<div id="s-app">
  <div class="app-top">
    <div class="app-logo" onclick="back()" title="Home">
      <img src="icon-header-blue.png" alt="Summer of Soccer" class="app-logo-icon">
    </div>
    <button class="edit-btn" onclick="back()">✎ Change teams</button>
  </div>
  <div class="score-ticker" id="score-ticker"></div>
  <div class="team-pill-bar" id="pill-bar"></div>

  <div class="bottom-nav">
    <button class="bnav-btn on" onclick="tab('live',this)" aria-label="Live scores">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16"/></svg>
      <span class="bnav-label">Live</span>
    </button>
    <button class="bnav-btn" onclick="tab('sched',this)" aria-label="Schedule">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="0"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span class="bnav-label">Schedule</span>
    </button>
    <button class="bnav-btn" onclick="tab('groups',this)" aria-label="Groups">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span class="bnav-label">Groups</span>
    </button>
    <button class="bnav-btn" onclick="tab('stats',this)" aria-label="Stats">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span class="bnav-label">Stats</span>
    </button>
    <button class="bnav-btn" onclick="tab('dyk',this)" aria-label="Did You Know">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <span class="bnav-label">DYN?</span>
    </button>
  </div>

  <div id="ptr-indicator" class="ptr-indicator">
    <div class="ptr-spinner"></div>
    <span class="ptr-label">Pull to refresh</span>
  </div>

  <div id="p-live" class="pane on">
    <div class="stat-row" id="stat-row"></div>
    <div class="sec span-all">Live now</div>
    <div id="live-wrap"></div>
    <div class="sec span-all">Today&#39;s results</div>
    <div id="done-wrap"></div>
  </div>

  <div id="p-sched" class="pane"></div>
  <div id="p-groups" class="pane"></div>
  <div id="p-stats" class="pane"></div>
  <div id="p-dyk" class="pane"></div>

</div>

<!-- TEAM DETAIL OVERLAY -->
<div id="team-overlay" class="team-overlay">
  <div id="team-content" class="team-overlay-panel"></div>
</div>

<!-- PLAYER DETAIL OVERLAY -->
<div id="player-overlay" class="player-overlay">
  <div id="player-content" class="player-overlay-panel"></div>
</div>

<!-- MATCH DETAIL OVERLAY -->
<div id="match-overlay" class="player-overlay">
  <div id="match-content" class="player-overlay-panel"></div>
</div>

<script src="flags.js"></script>
<script src="data.js"></script>
<script src="facts.js"></script>
<script src="squads.js"></script>
<script src="players.js"></script>
<script src="team.js"></script>
<script src="diyk.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/sw.js').catch(function(err) {
        console.warn('Service worker registration failed:', err);
      });
    });
  }
</script>
</body>
</html>
